[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/VeoveoAI/veoveo-hub"
publish = false

[workspace.dependencies]
# veoveo-core, pinned to one revision for every core crate.
veoveo-audit = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "433ed5f3a054e44da0bcb4aece2154ef695aeb07" }
veoveo-audit-contract = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "433ed5f3a054e44da0bcb4aece2154ef695aeb07" }
veoveo-fixtures = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "433ed5f3a054e44da0bcb4aece2154ef695aeb07" }
veoveo-http = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "433ed5f3a054e44da0bcb4aece2154ef695aeb07" }
veoveo-oauth = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "433ed5f3a054e44da0bcb4aece2154ef695aeb07" }
veoveo-store = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "433ed5f3a054e44da0bcb4aece2154ef695aeb07" }
veoveo-task = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "433ed5f3a054e44da0bcb4aece2154ef695aeb07" }
veoveo-types = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "433ed5f3a054e44da0bcb4aece2154ef695aeb07" }
veoveo-usage = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "433ed5f3a054e44da0bcb4aece2154ef695aeb07" }
veoveo-usage-contract = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "433ed5f3a054e44da0bcb4aece2154ef695aeb07" }
# veoveo-hub-sdk, pinned to one revision for the library and its test server.
veoveo-hub-sdk = { git = "https://github.com/VeoveoAI/veoveo-hub-sdk", rev = "b3da412fffa67420148bd677645d4b27f072d7a2" }
veoveo-hub-sdk-fixture = { git = "https://github.com/VeoveoAI/veoveo-hub-sdk", rev = "b3da412fffa67420148bd677645d4b27f072d7a2" }

aws-lc-rs = "1.18.0"
openshell-sdk = { git = "https://github.com/NVIDIA/OpenShell", rev = "5a7728c304b5528e954e9ae900cf21f84e1a12b1", version = "0.0.0" }
tokio-stream = "0.1"
anyhow = "=1.0.104"
async-stream = "0.3.6"
axum = "0.8.9"
base64 = "0.23.1"
chacha20poly1305 = { version = "=0.11.0", features = ["alloc", "getrandom", "rand_core"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
dotenvy = "0.15.7"
futures = "0.3.34"
getrandom = "0.4.3"
hex = "=0.4.3"
http-body = "=1.1.0"
jsonschema = "=0.58.6"
jsonwebtoken = { version = "=11.0.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
opentelemetry = "0.32.0"
opentelemetry_sdk = "0.32.1"
parking_lot = "0.12.5"
rcgen = "0.14.9"
reqwest = { version = "=0.13.5", default-features = false }
rmcp = { version = "=3.5.0", git = "https://github.com/VeoveoAI/rust-sdk", rev = "917e7914c93975fc1eddbff8792f1e2de933bc17" }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1.2.2"
secrecy = "0.10.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
# The 0.2 line, whose `Sse` type rmcp 3.5.0's transport exposes.
sse-stream = "=0.2.6"
# PostgreSQL 18 through sqlx, with the version and Rustls backend veoveo-core pins.
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid", "chrono", "json", "macros"] }
thiserror = "=2.0.21"
tokio = "1.53.1"
tokio-util = "0.7.19"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["fs", "trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "=2.5.8"
uuid = { version = "1.24.1", features = ["serde", "v4", "v5", "v7"] }
vaultrs = { version = "0.8.0", default-features = false, features = ["rustls"] }
zeroize = "=1.9.1"
tempfile = "=3.27.0"
