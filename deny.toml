# cargo-deny 0.20 policy: dependency licenses, security advisories, bans and sources.

[graph]
all-features = true

[advisories]
# Reviewed informational maintenance notice, not a claim that the graph is free of
# vulnerabilities. The locked rustls-pemfile 2.2.0 dependency comes through
# openshell-core from VeoveoAI/OpenShell at 9724fb1834dec157b4482a1da97338fd8ca1e50c.
# Its code is unchanged from the original 5a7728c advisory review named below.
# It parses configured CA certificates into rustls-pki-types; RootCertStore validates
# them. RustSec lists no patched version. Remove this exception when the pinned SDK
# removes the dependency. cargo-deny 0.20.2 scopes this by advisory ID only, not caller.
# https://rustsec.org/advisories/RUSTSEC-2025-0134.html
ignore = [
    { id = "RUSTSEC-2025-0134", reason = "Reviewed unmaintained rustls-pemfile 2.2.0 via pinned openshell-core (5a7728c304b5528e954e9ae900cf21f84e1a12b1); informational maintenance notice, no patched release. Remove when the SDK drops the dependency." },
]
unused-ignored-advisory = "deny"

[licenses]
# Licenses compatible with distributing an Apache-2.0 project. Add a license here only
# after reviewing it, and record crate-specific cases under `exceptions`.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The upstream source remains allowed; allow-org admits the reviewed VeoveoAI fork.
# Cargo.toml/lock retain the exact reviewed revision.
allow-git = ["https://github.com/NVIDIA/OpenShell"]

[sources.allow-org]
github = ["VeoveoAI"]
