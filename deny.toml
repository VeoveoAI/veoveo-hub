# cargo-deny 0.20 policy: dependency licenses, security advisories, bans and sources.

[graph]
all-features = true

[advisories]
# Reviewed informational maintenance notice, not a claim that the graph is free of
# vulnerabilities. The locked unsafe-libyaml 0.2.11 comes through serde_yaml
# 0.9.34+deprecated, which kube-client 0.99 uses through openshell-crypto from
# VeoveoAI/OpenShell at 5f630f42ccf26336419a90ce01cccba40dfbf6c1, and which the Hub uses
# to read a branch's `openshell/providers.yaml`, a list of at most 16 provider names
# that the factory validates after parsing. RustSec lists no vulnerability and no
# patched version. Remove this exception when the Hub and the pinned OpenShell crates no
# longer depend on serde_yaml.
# https://rustsec.org/advisories/RUSTSEC-2024-0449.html
#
# Reviewed informational maintenance notices, not claims that the graph is free of
# vulnerabilities. chrono 0.4.45 is used by core, the SDK and the Hub's sqlx feature, and
# comes through rmcp 3.11.0, schemars 1.2.2, oauth2 5.0.0, object_store 0.14.1, sqlx 0.9.0
# and openshell-core; humantime 2.4.0 comes through object_store 0.14.1 in core's audit.
# RustSec lists no vulnerability and no patched version for either. Remove these
# exceptions when the Hub's graph no longer contains them.
# https://rustsec.org/advisories/RUSTSEC-2026-0543.html
# https://rustsec.org/advisories/RUSTSEC-2026-0542.html
ignore = [
    { id = "RUSTSEC-2024-0449", reason = "Reviewed unmaintained unsafe-libyaml 0.2.11 via serde_yaml 0.9.34, used by kube-client 0.99 through openshell-crypto (5f630f42ccf26336419a90ce01cccba40dfbf6c1) and by the Hub for providers.yaml; informational maintenance notice, no patched release. Remove when the Hub and OpenShell drop serde_yaml." },
    { id = "RUSTSEC-2026-0543", reason = "Reviewed unmaintained chrono 0.4.45, used by core, the SDK and the Hub's sqlx feature and through rmcp, schemars, oauth2, object_store, sqlx and openshell-core; informational maintenance notice, no patched release. Remove when the graph drops chrono." },
    { id = "RUSTSEC-2026-0542", reason = "Reviewed unmaintained humantime 2.4.0 via object_store 0.14.1 in core's audit; informational maintenance notice, no patched release. Remove when object_store drops it." },
]
unused-ignored-advisory = "deny"

[licenses]
# Licenses compatible with distributing an Apache-2.0 project. Add a license here only
# after reviewing it, and record crate-specific cases under `exceptions`.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The upstream source remains allowed; allow-org admits the reviewed VeoveoAI fork.
# Cargo.toml/lock retain the exact reviewed revision.
allow-git = ["https://github.com/NVIDIA/OpenShell"]

[sources.allow-org]
github = ["VeoveoAI"]
