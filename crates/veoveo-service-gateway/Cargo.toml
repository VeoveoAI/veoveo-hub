[package]
name = "veoveo-service-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autobins = false

[lib]
name = "veoveo_service_gateway"
path = "src/lib.rs"

[[bin]]
name = "veoveo-service-gateway"
path = "src/bin/gateway.rs"

[dependencies]
veoveo-audit.workspace = true
veoveo-audit-contract = { workspace = true, features = ["postgres"] }
veoveo-http.workspace = true
veoveo-oauth.workspace = true
veoveo-store.workspace = true
veoveo-sdk-rust.workspace = true
veoveo-task.workspace = true
veoveo-types.workspace = true
veoveo-usage.workspace = true
veoveo-usage-contract.workspace = true
anyhow.workspace = true
async-stream.workspace = true
aws-lc-rs.workspace = true
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
chacha20poly1305.workspace = true
chrono.workspace = true
clap.workspace = true
dotenvy.workspace = true
futures.workspace = true
getrandom.workspace = true
hex.workspace = true
http-body.workspace = true
jsonwebtoken.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
parking_lot.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-no-provider", "stream"] }
rmcp = { workspace = true, features = ["server", "client", "transport-streamable-http-client-reqwest", "transport-streamable-http-server", "reqwest-tls-no-provider"] }
rustls.workspace = true
schemars = { workspace = true, features = ["chrono04", "url2", "uuid1"] }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sse-stream.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["rt"] }
tower.workspace = true
tower-http = { workspace = true, features = ["set-header"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
vaultrs.workspace = true
zeroize.workspace = true

[dev-dependencies]
veoveo-sdk-rust = { workspace = true, features = ["testing"] }
veoveo-sdk-rust-fixture.workspace = true
tempfile.workspace = true
veoveo-fixtures = { workspace = true, features = ["store", "database-conformance"] }
jsonschema.workspace = true
rcgen.workspace = true
schemars.workspace = true
# The registration test migrates the fixture server's schema.
sqlx = { workspace = true, features = ["migrate"] }
